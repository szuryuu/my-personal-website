<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Site.Params.description }}">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" type="image/x-icon" href="{{ "favicon.ico" | relURL }}">
    <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
    {{ with resources.Get "css/main.css" }}{{ $style := . | minify | fingerprint }}<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">{{ end }}
  </head>
  <body>
    {{ block "main" . }}{{ end }}
    {{ with resources.Get "js/site.js" }}{{ $script := . | minify | fingerprint }}<script defer src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}"></script>{{ end }}
  </body>
</html>
