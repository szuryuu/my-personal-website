version: 1
frontend:
  phases:
    preBuild:
      commands:
        - export HUGO_VERSION=0.140.0
        - curl -sSL https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz -o /tmp/hugo.tar.gz
        - mkdir -p /tmp/hugo && tar -xzf /tmp/hugo.tar.gz -C /tmp/hugo
        - export PATH=/tmp/hugo:$PATH
        - hugo version
    build:
      commands:
        - export PATH=/tmp/hugo:$PATH
        - hugo --gc --minify
  artifacts:
    baseDirectory: public
    files:
      - "**/*"
  cache:
    paths:
      - resources/**/*
